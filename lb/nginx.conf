user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout 65;

    # L7 backend pool: the two PHP-FPM workers.
    # max_fails=0 -> never mark down in the demo (we want to SEE the round-robin).
    upstream php_backend {
        server 172.18.0.11:9000 max_fails=0;
        server 172.18.0.12:9000 max_fails=0;
    }

    server {
        listen 8080;
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root  /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Backend identification is done in PHP from the FPM hostname, NOT from
        # $_SERVER['SERVER_ADDR'] (that is nginx's IP) and NOT from gethostbyname() (hangs).
        location ~ \.php$ {
            fastcgi_pass  php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;
        }
    }
}

# L4: plain TCP proxy (SSH into the backends) — must live outside http{}.
stream {
    upstream web1_ssh  { server 172.18.0.11:22; }
    upstream web2_ssh  { server 172.18.0.12:22; }
    upstream admin_ssh { server 172.18.0.15:22; }

    server { listen 2222; proxy_pass web1_ssh; }
    server { listen 2223; proxy_pass web2_ssh; }
    server { listen 2224; proxy_pass admin_ssh; }
}
