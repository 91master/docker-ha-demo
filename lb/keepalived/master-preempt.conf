vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass 12345678
    }

    # unicast, NOT the default multicast: multicast over a docker bridge is unreliable
    unicast_src_ip 172.18.0.10
    unicast_peer {
        172.18.0.16
    }

    virtual_ipaddress {
        172.18.0.100/16 dev eth0
    }
}
