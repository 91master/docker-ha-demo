vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 90
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass 12345678
    }

    unicast_src_ip 172.18.0.16
    unicast_peer {
        172.18.0.10
    }

    virtual_ipaddress {
        172.18.0.100/16 dev eth0
    }
}
