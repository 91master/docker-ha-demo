vrrp_instance VI_1 {
    # nopreempt: both nodes come up as BACKUP, the higher priority wins the initial
    # election, but after a failback the VIP STAYS on the other node.
    state BACKUP
    nopreempt
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass 12345678
    }

    unicast_src_ip 172.18.0.10
    unicast_peer {
        172.18.0.16
    }

    virtual_ipaddress {
        172.18.0.100/16 dev eth0
    }
}
